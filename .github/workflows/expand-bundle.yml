name: Expand project bundle

on:
  push:
    paths:
      - "project-bundle.zip"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand project files
        run: |
          mkdir -p /tmp/tawjihi
          unzip -q project-bundle.zip -d /tmp/tawjihi
          cp -a /tmp/tawjihi/tawjihi-together/. .
      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html CONTRIBUTING.md APPLICATION_NOTES.md subjects
          git diff --cached --quiet || git commit -m "Add interactive Tawjihi study resources"
          git push
