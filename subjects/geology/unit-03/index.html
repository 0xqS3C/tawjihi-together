<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<style>
/* تخطيط: شريط علوي ثابت بتبويبات + عمود محتوى واحد (حتى 980px)؛ الأولوية للاستذكار لا للزخرفة */
:root{
  --bg:#EEF2F0; --surf:#FFFFFF; --surf2:#F4F7F6; --ink:#14221E; --mute:#566A63; --line:#D3DEDA;
  --acc:#0E6B5C; --acc-ink:#FFFFFF; --acc-soft:#DCEFE9;

  --sky:#F6F3EA; --figline:#1D2B27; --arrow:#C2410C;
  --s0:#F1E3B3; --s1:#E4C98A; --s2:#D4A66B; --s3:#BE7F55; --s4:#A06249; --s5:#7E6B58; --s6:#5B705E; --s7:#3F5B6B;
  --land:#E7EBD9; --road:#8A8F94; --river:#4C8DB5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surf:#151F1C; --surf2:#1B2723; --ink:#E4EDE9; --mute:#93A8A1; --line:#2A3A35;
  --acc:#4CC2A5; --acc-ink:#06211B; --acc-soft:#15332B;
  --good:#5CC98A; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3A1B18; --warn:#E3B05A; --warn-soft:#35280F;
  --sky:#1C2623; --figline:#E4EDE9; --arrow:#FB9A5C;
  --s0:#6E6338; --s1:#7F6A3A; --s2:#8A6742; --s3:#8A5B45; --s4:#7B5042; --s5:#625A4C; --s6:#46594D; --s7:#34505E;
  --land:#27312A; --road:#9AA0A5; --river:#5EA3CC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surf:#151F1C; --surf2:#1B2723; --ink:#E4EDE9; --mute:#93A8A1; --line:#2A3A35;
  --acc:#4CC2A5; --acc-ink:#06211B; --acc-soft:#15332B;
  --good:#5CC98A; --good-soft:#15301F; --bad:#F08A80; --bad-soft:#3A1B18; --warn:#E3B05A; --warn-soft:#35280F;
  --sky:#1C2623; --figline:#E4EDE9; --arrow:#FB9A5C;
  --s0:#6E6338; --s1:#7F6A3A; --s2:#8A6742; --s3:#8A5B45; --s4:#7B5042; --s5:#625A4C; --s6:#46594D; --s7:#34505E;
  --land:#27312A; --road:#9AA0A5; --river:#5EA3CC; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surf)}
#root{max-width:980px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.4;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:.5em 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surf);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hdr-in{max-width:980px;margin:0 auto}
.hdr-top{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.hdr-top h1{font-size:1.05rem;flex:1;min-width:180px}
.hdr-top h1 small{display:block;font:400 .78rem var(--font);color:var(--mute)}
.pbar{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pbar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .2s}
.hdr-prog{display:flex;align-items:center;gap:8px;min-width:150px}
.hdr-prog .pbar{flex:1}
.hdr-prog b{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:left}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--mute);font-weight:500}
.tab[aria-current="page"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.tab .bd{display:inline-block;min-width:1.5em;padding:0 6px;margin-inline-start:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.75rem;line-height:1.5;text-align:center}
.ic{border:1px solid var(--line);background:var(--surf2);border-radius:8px;padding:6px 12px;font-size:.9rem}
main{padding-top:20px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.box.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mute{color:var(--mute)} .sm{font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surf2);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.sm{padding:4px 10px;font-size:.85rem}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;background:var(--surf2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.off{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.chip.gen{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.chip.g{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.b{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.w{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.note{border-inline-start:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:6px;font-size:.9rem}
.note.info{border-color:var(--acc);background:var(--acc-soft)}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--surf2);border:1px solid var(--line);border-radius:10px}
.stat b{font:700 1.6rem/1.2 var(--font-d);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--mute)}
.def{background:var(--acc-soft);border-radius:8px;padding:10px 14px;margin:10px 0;border-inline-start:4px solid var(--acc)}
.trap{background:var(--bad-soft);border-radius:8px;padding:8px 14px;margin:10px 0;border-inline-start:4px solid var(--bad);font-size:.95rem}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--surf2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0} td:first-child,th:first-child{border-inline-start:0;font-weight:600}
td:first-child{background:var(--surf2)}
.lesson-tabs{display:flex;gap:8px;flex-wrap:wrap}
.q{display:flex;flex-direction:column;gap:10px}
.q-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q-t{font-weight:600;white-space:pre-line}
.q-ref{font-size:.82rem;color:var(--mute)}
.q textarea,.q input[type=text],.q select,.inp{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
.q textarea{min-height:76px;resize:vertical}
.q input.blank{display:inline-block;width:11em;max-width:100%;min-height:36px;vertical-align:baseline;padding:2px 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);cursor:pointer}
.opt input{margin-top:6px}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.ans{background:var(--good-soft);border:1px solid var(--good);border-radius:8px;padding:10px 14px;white-space:pre-line}
.ans.mine{background:var(--surf2);border-color:var(--line)}
.ans b.l{display:block;font-size:.8rem;color:var(--mute);font-weight:600;margin-bottom:2px}
.ans.good b.l{color:var(--good)}
.res{padding:8px 14px;border-radius:8px;font-weight:700}
.res.g{background:var(--good-soft);color:var(--good)} .res.b{background:var(--bad-soft);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.part{display:flex;flex-direction:column;gap:6px}
.part>b{font-size:.92rem}
.lbl-row{display:flex;gap:8px;align-items:center}
.lbl-row b{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none;font-size:.9rem}
.sec-h{display:flex;align-items:center;gap:8px;margin-top:6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;padding:24px}
.fc .big{font:600 1.5rem/1.5 var(--font-d)}
.fc .en{direction:ltr;color:var(--mute)}
.fc .back{font-size:1.1rem}
.rate{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.st{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.st button{border:0;background:var(--surf2);padding:3px 10px;font-size:.82rem;border-inline-start:1px solid var(--line)}
.st button:first-child{border-inline-start:0}
.st button.on0{background:var(--bad-soft);color:var(--bad);font-weight:700}
.st button.on1{background:var(--warn-soft);color:var(--warn);font-weight:700}
.st button.on2{background:var(--good-soft);color:var(--good);font-weight:700}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ck .tm{flex:1;min-width:150px;font-weight:600}
.ck .df{flex-basis:100%;font-size:.93rem;color:var(--mute)}
.mask{background:var(--surf2);border:1px dashed var(--line);border-radius:6px;color:var(--mute);width:100%;text-align:center;padding:2px 6px;font-size:.82rem}
.fig{display:block;width:100%;max-width:560px;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--sky);margin-inline:auto}
.fig .sky{fill:var(--sky)} .fig .land{fill:var(--land)} .fig .road{fill:var(--road)} .fig .rv{stroke:var(--river);stroke-width:7;fill:none}
.s0{fill:var(--s0)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}.s5{fill:var(--s5)}.s6{fill:var(--s6)}.s7{fill:var(--s7)}
.fig .pl{stroke:var(--figline);stroke-width:3.2;fill:none} .fig .gnd{stroke:var(--figline);stroke-width:2.5}
.fig .ar{stroke:var(--arrow);stroke-width:3.2} .fig .arh{fill:var(--arrow)}
.fig .ax{stroke:var(--figline);stroke-width:2;stroke-dasharray:7 5;fill:none}
.fig .ld{stroke:var(--figline);stroke-width:1.5}
.fig .ring{stroke:var(--figline);stroke-width:1.2}
.fig .dot{fill:var(--arrow);stroke:var(--figline);stroke-width:1.5}
.fig .lbl{font:600 13px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--sky);stroke-width:4px;stroke-linejoin:round}
.fig .cap{font:500 11.5px var(--font);fill:var(--mute);paint-order:stroke;stroke:var(--sky);stroke-width:3px}
.fig .age{font:700 15px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--sky);stroke-width:4px}
.fig .nb{fill:var(--acc)} .fig .nt{fill:var(--acc-ink);font:700 13px var(--font)}
.fig text{direction:ltr;unicode-bidi:plaintext}
.figbox{display:flex;flex-direction:column;gap:6px}
.figcap{font-size:.8rem;color:var(--warn);text-align:center}
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-r{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;font-size:.92rem}
.bar-r .pbar{height:12px}
.bar-r .pbar.bad>i{background:var(--bad)} .bar-r .pbar.good>i{background:var(--good)}
.path{display:grid;grid-template-columns:minmax(120px,1.2fr) repeat(4,1fr);gap:6px;align-items:center}
.path .hd{font-size:.8rem;color:var(--mute);font-weight:600}
.path a,.path button.cell{border:1px solid var(--line);background:var(--surf2);border-radius:8px;padding:6px 8px;text-align:center;font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
.path .done{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
textarea.exp{min-height:120px;font:13px/1.5 monospace;direction:ltr;text-align:left;width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:8px}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem}
@media (max-width:640px){
  .bar-r{grid-template-columns:100px 1fr 48px}
  .path{grid-template-columns:1fr 1fr 1fr 1fr}.path>.lh{grid-column:1/-1;font-weight:700}.path>.hd{display:none}
  .tab{padding:10px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ===== بيانات التعلم والحفظ — المصدر: المستند المرفق ===== */
const LESSONS = [
{id:'l1', n:1, title:'تشوه الصخور', en:'Deformation of Rocks', pages:'86–93', sections:[
 {h:'المفاهيم الأساسية (تعاريف رسمية)', html:`
  <div class="def"><b>التشوه (Deformation):</b> التغير الكلي في شكل الصخور أو حجمها أو كليهما معاً نتيجة تأثير القوى المختلفة.</div>
  <div class="def"><b>التراكيب الجيولوجية (Geological Structures):</b> الأشكال والأوضاع الجيولوجية الثانوية التي تتخذها صخور القشرة الأرضية نتيجة تعرضها لقوى تشوهها.</div>
  <div class="def"><b>الإجهاد (Stress):</b> القوة المؤثرة في وحدة المساحة من الصخر. القانون: الإجهاد = القوة ÷ المساحة، ووحدته نيوتن/م² (N/m²).</div>
  <div class="def"><b>المطاوعة (Strain):</b> استجابة الصخر للإجهاد المؤثر فيه، وتتمثل في التغير في شكل الصخر أو حجمه أو كليهما معاً مقارنة بالحالة الأصلية. <b>ليس لها وحدة قياس.</b></div>
  <div class="trap"><b>فخ امتحاني:</b> الإجهاد له وحدة (N/m²)، والمطاوعة بلا وحدة.</div>`},
 {h:'الإجهاد والمطاوعة وسلوك الصخور', html:`
  <div class="def"><b>حد المرونة (Elastic Limit):</b> الحد الذي لا يمكن للصخور بعده أن تعود إلى وضعها الأصلي الذي كانت عليه قبل تأثرها بالإجهاد.</div>
  <p><b>السلوك المرن:</b> إجهاد <u>أقل من حد المرونة</u> (للهشة واللدنة): يتغير الشكل مؤقتاً ويعود الصخر لوضعه الأصلي عند زوال الإجهاد. العلاقة بين الإجهاد والمطاوعة طردية.</p>
  <div class="tbl"><table><tr><th></th><th>الصخر الهش</th><th>الصخر اللدن</th></tr>
  <tr><td>بعد تجاوز حد المرونة</td><td>ينكسر مباشرة</td><td>ينثني ويتغير شكله وحجمه دون كسر مباشر، وإذا استمر الإجهاد وتجاوز <b>نقطة الكسر</b> ينكسر</td></tr>
  <tr><td>اسم التشوه</td><td>التشوه الهش</td><td>التشوه اللدن</td></tr>
  <tr><td>أمثلة</td><td>البازلت، الصوان</td><td>الصخور الطينية، الغضار</td></tr>
  <tr><td>التركيب الناتج</td><td>صدوع</td><td>طيات</td></tr></table></div>`},
 {h:'العوامل المؤثرة في تشوه الصخور (4 عوامل)', html:`
  <ol><li><b>نوع الصخر:</b> هش ينكسر، لدن ينثني.</li>
  <li><b>نوع الإجهاد:</b> اتجاه القوة يحدد طبيعة التشوه.</li>
  <li><b>درجة الحرارة:</b> الحرارة المرتفعة في الأعماق (بفعل الممال الحراري الأرضي) تحول سلوك الصخور الهشة إلى لدن.</li>
  <li><b>الزمن:</b> بقاء الصخور مدداً طويلة تحت إجهاد دون حد المرونة يعدّل سلوك الهشة إلى لدن.</li></ol>
  <div class="trap"><b>فخ:</b> «عمر الصخر» ليس من العوامل (جاء كخيار خاطئ في سؤال كتاب الطالب).</div>`},
 {h:'أنواع الإجهاد (جدول المقارنة)', html:`
  <div class="tbl"><table><tr><th>الإجهاد</th><th>اتجاه القوة</th><th>في الصخور الهشة</th><th>في الصخور اللدنة</th><th>التركيب</th></tr>
  <tr><td><b>ضغط</b></td><td>قوتان متقابلتان متعاكستان باتجاه الجسم الصخري، في مستوى واحد</td><td>كسر بسبب الضغط</td><td>طي وانثناء نحو الأعلى أو الأسفل</td><td>صدع عكسي (هشة) / طيات (لدنة)</td></tr>
  <tr><td><b>شد</b></td><td>قوتان متعاكستان متباعدتان عن الجسم الصخري، في مستوى واحد</td><td>كسر بسبب الشد</td><td>اتساع وتقليل السماكة في الوسط وانتفاخ الأطراف</td><td>صدع عادي وأنظمة صدوع (هشة)</td></tr>
  <tr><td><b>قص</b></td><td>قوتان متعاكستان تتحركان بصورة متوازية في مستويين مختلفين</td><td>كسر بسبب القص</td><td>انثناء وانزياح أفقياً بسبب القص</td><td>صدع جانبي (هشة)</td></tr></table></div>
  <div class="trap"><b>فخ:</b> الصخور الهشة قد تشكل طيات إذا كانت في أعماق كبيرة (حرارة عالية) أو تحت إجهاد دون حد المرونة لزمن طويل جداً.</div>`}
]},
{id:'l2', n:2, title:'الصدوع', en:'Faults', pages:'94–101', sections:[
 {h:'التعريف وأجزاء الصدع', html:`
  <div class="def"><b>الصدع (Fault):</b> كسر يحدث في صخور القشرة الأرضية نتيجة تعرضها لإجهادات تؤدي إلى تحرك كتلتين صخريتين على جانبي مستوى الكسر بصورة موازية له، مع بقاء الكتلتين متلامستين غالباً.</div>
  <div class="def"><b>مستوى الصدع (Fault Plane):</b> سطح الكسر الذي تتحرك عليه الكتل الصخرية.</div>
  <div class="def"><b>الجدار المعلق (Hanging Wall):</b> الكتلة الصخرية التي تقع <b>فوق</b> مستوى الصدع المائل (تبدو معلقة فوق رأس الجيولوجي).</div>
  <div class="def"><b>الجدار القدم (Foot Wall):</b> الكتلة الصخرية التي تقع <b>أسفل</b> مستوى الصدع المائل (أسفل قدم الجيولوجي).</div>
  <div class="trap"><b>فخ:</b> في الصدع الرأسي (90°) لا يمكن التمييز بين الجدار المعلق والقدم.</div>`},
 {h:'تصنيف الصدوع', html:`
  <p><b>أولاً: حسب ميل مستوى الصدع:</b> <b>رأسية</b> (الميل = 90° تماماً) و<b>مائلة</b> (أكبر من 0° وأقل من 90°).</p>
  <p><b>ثانياً: حسب الحركة النسبية للكتلتين:</b> حركة رأسية (<b>عادي</b>، <b>عكسي</b>) وحركة أفقية (<b>جانبي</b>).</p>
  <div class="tbl"><table><tr><th>وجه المقارنة</th><th>العادي</th><th>العكسي</th><th>الجانبي</th></tr>
  <tr><td>الإجهاد</td><td>شد</td><td>ضغط</td><td>قص</td></tr>
  <tr><td>الحركة النسبية</td><td>رأسية</td><td>رأسية</td><td>أفقية</td></tr>
  <tr><td>ميل مستوى الصدع</td><td>أكبر من 0° وأقل من 90°</td><td>أكبر من 0° وأقل من 90°</td><td>90°، وقد يميل (أكبر من 0° وأقل من 90°)</td></tr>
  <tr><td>حركة الجدار المعلق</td><td>إلى الأسفل بالنسبة للقدم</td><td>إلى الأعلى بالنسبة للقدم</td><td>حركة أفقية للكتلتين</td></tr>
  <tr><td>تكرار الطبقات رأسياً مع العمق</td><td>لا يحدث</td><td>تتكرر</td><td>لا يحدث</td></tr>
  <tr><td>مساحة القشرة</td><td>تزيد</td><td>تقل</td><td>—</td></tr>
  <tr><td>مثال في الأردن</td><td>—</td><td>صدع طريق عمان التنموي (شارع الـ100)*</td><td>صدع البحر الميت التحويلي</td></tr></table></div>
  <p class="note">* ورد هذا المثال في «قائمة الحفظ» في المستند فقط.</p>`},
 {h:'أنظمة الصدوع (قوى شد واسعة النطاق ← صدوع عادية)', html:`
  <div class="tbl"><table><tr><th>النظام</th><th>التركيب</th><th>الجدار المشترك</th><th>مثال أردني</th></tr>
  <tr><td><b>الصدوع الدرجية</b> (Step Faults)</td><td>مجموعة صدوع عادية متوازية، الكتل بشكل الأدراج</td><td>—</td><td>وادي الموجب</td></tr>
  <tr><td><b>الحوض الخسفي</b> (Graben)</td><td>صدعان عاديان متقابلان، تهبط الكتلة بينهما للأسفل</td><td>يشتركان في الجدار <b>المعلق</b></td><td>غور الأردن</td></tr>
  <tr><td><b>الكتلة الاندفاعية</b> (Horst)</td><td>صدعان عاديان متقابلان، تبرز الكتلة بينهما للأعلى</td><td>يشتركان في الجدار <b>القدم</b></td><td>—</td></tr></table></div>
  <div class="trap"><b>فخ:</b> الحوض الخسفي والكتلة الاندفاعية كلاهما من صدعين عاديين متقابلين بقوى شد؛ الفرق في الجدار المشترك: معلق (حوض)، قدم (اندفاعية).</div>`}
]},
{id:'l3', n:3, title:'الطيات', en:'Folds', pages:'102–110', sections:[
 {h:'مفهوم الطية وأجزاؤها', html:`
  <div class="def"><b>الطية (Fold):</b> تركيب جيولوجي ينشأ في الصخور اللدنة (أو الهشة التي تتعرض لدرجات حرارة مرتفعة في أعماق كبيرة)، حيث تنثني الطبقات الصخرية وتتقوس دون أن تتكسر تحت تأثير إجهاد الضغط غالباً.</div>
  <div class="def"><b>جناح الطية (Fold Limb):</b> أحد جانبي الطية، وللطية جناحان من طبقات مائلة يلتقيان عند محور الطية.</div>
  <div class="def"><b>مفصل الطية (Fold Hinge):</b> الخط الوهمي الذي يصل بين النقاط التي تقع على أقصى تكور (انحناء) للطبقة الصخرية في الطية.</div>
  <div class="def"><b>المستوى المحوري (Axial Plane):</b> مستوى وهمي يمر بمحور الطية ويقسم الطية إلى قسمين متساويين ومتناظرين تماماً في الطية المتماثلة. قد يكون أفقياً أو مائلاً أو رأسياً.</div>
  <div class="def"><b>محور الطية (Fold Axis):</b> خط ناتج من تقاطع المستوى المحوري مع سطح إحدى الطبقات المكونة للطية، وعنده تحدث عملية الطي ويحدد أقصى تكور للطبقة.</div>
  <div class="trap"><b>فخ (الخطأ الشائع 1 في المستند):</b> الخلط بين مفصل الطية (خط يصل بين نقاط أقصى انحناء) ومحور الطية (خط تقاطع المستوى المحوري مع سطح الطبقة).</div>`},
 {h:'تصنيف الطيات', html:`
  <p><b>أ. حسب اتجاه التقوس:</b></p>
  <div class="tbl"><table><tr><th></th><th>محدبة (Anticline)</th><th>مقعرة (Syncline)</th></tr>
  <tr><td>التقوس</td><td>نحو الأعلى</td><td>نحو الأسفل</td></tr>
  <tr><td>ميل الجناحين</td><td>بعيداً عن المستوى المحوري</td><td>نحو المستوى المحوري</td></tr>
  <tr><td>الأعمار في المركز</td><td>الأقدم في الوسط</td><td>الأحدث في الوسط</td></tr></table></div>
  <p><b>ب. حسب زاوية ميل المستوى المحوري:</b></p>
  <div class="tbl"><table><tr><th>النوع</th><th>المستوى المحوري</th><th>الجناحان</th><th>الضغط المسبب</th></tr>
  <tr><td>متماثلة</td><td>عمودي على سطح الأرض (90°)</td><td>ميل متساوٍ</td><td>متساوٍ على الجانبين</td></tr>
  <tr><td>غير متماثلة</td><td>مائل بزاوية أقل من 90°</td><td>ميل كل جناح مختلف</td><td>غير متساوٍ على الجانبين</td></tr>
  <tr><td>مقلوبة</td><td>مائل بدرجة كبيرة عن العمودي</td><td>يميلان في الاتجاه نفسه، وزاوية أحدهما أكبر من 90°؛ طبقات أحد الجناحين مقلوبة</td><td>غير متساوٍ شديد جداً على أحد الجانبين</td></tr>
  <tr><td>مضطجعة</td><td>أفقي تقريباً</td><td>يميلان في الاتجاه نفسه بصورة أفقية تقريباً</td><td>—</td></tr></table></div>`}
]},
{id:'l4', n:4, title:'القبة والحوض', en:'Dome and Basin', pages:'ضمن الدرس الثالث', sections:[
 {h:'القبة والحوض (تنشآن من الطيات المتماثلة)', html:`
  <div class="def"><b>القبة (Dome):</b> طية محدبة متماثلة تميل طبقاتها بعيداً عن المركز في كل الاتجاهات، والأقدم في المركز.</div>
  <div class="def"><b>الحوض (Basin):</b> طية مقعرة متماثلة تميل طبقاتها نحو المركز في كل الاتجاهات، والأحدث في المركز.</div>
  <div class="tbl"><table><tr><th>وجه المقارنة</th><th>القبة</th><th>الحوض</th></tr>
  <tr><td>الطية الأصلية</td><td>محدبة متماثلة</td><td>مقعرة متماثلة</td></tr>
  <tr><td>النشوء</td><td>اندفاع الماغما وتبريدها أسفل السطح، أو ضغط من الأسفل للطبقات</td><td>هبوط القشرة نحو الأسفل نتيجة ثقل الرواسب المتراكمة</td></tr>
  <tr><td>ميل الطبقات</td><td>بالدرجة نفسها وفي جميع الاتجاهات <b>بعيداً</b> عن المركز</td><td>بالدرجة نفسها وفي جميع الاتجاهات <b>نحو</b> المركز</td></tr>
  <tr><td>التكشف بعد الحت والتعرية</td><td>دائري/إهليليجي: <b>الأقدم</b> في المركز، الأحدث على الأطراف</td><td>دائري/إهليليجي: <b>الأحدث</b> في المركز، الأقدم على الأطراف</td></tr>
  <tr><td>الشكل في المقطع العرضي</td><td>شبيهة بالطية المحدبة</td><td>شبيهة بالطية المقعرة</td></tr>
  <tr><td>مثال أردني</td><td>حوض البقعة (كان في الأصل قبة ثم تعرض للحت والتعرية)</td><td>الأحواض الترسيبية</td></tr></table></div>
  <div class="trap"><b>فخ (الخطأ الشائع 2):</b> حوض البقعة لم ينشأ كطية مقعرة؛ كان في الأصل <b>قبة</b> (طية محدبة ارتفعت كجبل) ثم تآكلت قمتها الأقدم بفعل التجوية والحت فتحولت إلى منطقة منخفضة.</div>`}
]},
{id:'l5', n:5, title:'الجيولوجيا الهندسية', en:'Engineering Geology', pages:'111 (إثراء وتوسع)', sections:[
 {h:'إثراء وتوسع', html:`
  <div class="def"><b>الجيولوجيا الهندسية (Engineering Geology):</b> التطبيق العملي لعلم الجيولوجيا في مجالات الهندسة المختلفة، حيث تؤخذ العوامل والتراكيب الجيولوجية بعين الاعتبار عند تخطيط وتصميم وتنفيذ المنشآت الهندسية.</div>
  <ul><li><b>اختيار الموقع والتصميم:</b> تؤثر الصدوع والطيات والفواصل على ثبات الصخور وتحملها للأحمال الهندسية.</li>
  <li><b>السدود والأنفاق والجسور:</b> وجود الصدوع أو نطاقات التهشم قربها يضعف القابلية التحميلية للطبقات ويتسبب في تسرب المياه أو انهيار المنشآت.</li>
  <li><b>سلامة المباني:</b> تجب دراسة أثر الإجهادات والتشوهات الجيولوجية لضمان استقرار الأساسات ومقاومتها للنشاط الزلزالي.</li></ul>
  <p class="note">لا توجد أسئلة رسمية لهذا الدرس في المستند المرفق.</p>`}
]}
];

function foldBand(o){
  const {A,L,y0,th,sg,k0,k1,shear,rot,erode,ground,axial}=Object.assign({A:40,L:240,y0:90,th:28,sg:1,k0:-1,k1:4,shear:0,rot:0,erode:false,ground:110,axial:false},o);
  const f=(k,x)=>y0+k*th-sg*A*Math.cos(2*Math.PI*(x-210)/L);
  let g='';
  for(let k=k0;k<k1;k++){
    let top='',bot=[];
    for(let x=-320;x<=740;x+=6){top+=(top?'L':'M')+x+' '+f(k,x).toFixed(1);bot.unshift('L'+x+' '+f(k+1,x).toFixed(1));}
    g+=`<path d="${top}${bot.join('')}Z" class="s${Math.max(0,Math.min(7,k-k0+(erode?0:1)))}"/>`;
  }
  const yc=y0+th*2;
  if(axial) g+=`<line x1="210" y1="-200" x2="210" y2="500" class="ax"/>`;
  let tf='';
  if(rot) tf=`translate(210,125) rotate(${rot}) translate(-210,${-yc})`;
  else if(shear) tf=`matrix(1 0 ${-shear} 1 ${shear*yc} 0)`;
  return {g:`<g${tf?` transform="${tf}"`:''}>${g}</g>`,f};
}

    return `<div class="figbox">${q.task.render('nums')}<div class="figcap">رسم توضيحي من إعداد التطبيق وليس شكلاً رسمياً من الكتاب</div></div>`+parts.map((_,i)=>`<div class="lbl-row"><b>${i+1}</b><select data-p="${i}"><option value="">— اختر —</option>${pm.map(j=>`<option value="${esc(parts[j])}"${val&&val[i]===parts[j]?' selected':''}>${esc(parts[j])}</option>`).join('')}</select></div>`).join('');}

function readAns(q,root){
  if(!q.off&&(q.type==='mcq'||q.type==='tf')){const c=root.querySelector('input[type=radio]:checked');return c?(q.type==='mcq'?+c.value:c.value):null;}
  const els=[...root.querySelectorAll('[data-p]')];const a=els.map(e=>e.value.trim());

}
function gradeAuto(q,a){
  if(a==null)return false;
  if(q.type==='mcq')return a===q.ans;
  if(q.type==='tf')return (a==='1')===q.ans;
  if(q.type==='fill')return q.answers.every((acc,i)=>{const t=stripAl(nz(a[i]));return acc.some(x=>{const n=stripAl(nz(x));return n===t||(t.length>=3&&n.length>=3&&(n.includes(t)&&t.length>=n.length*.8))})});
  if(q.type==='match')return q.pairs.every((p,i)=>a[i]===p[1]);
  if(q.type==='label')return q.task.parts.every((p,i)=>a[i]===p);
  return false;
}
function ansText(q,a){
  if(a==null)return '(لا أعرف)';
  if(q.off&&q.type==='multi')return a.map((x,i)=>q.parts[i].l+') '+(x||'—')).join('\n');
  if(!q.off&&q.type==='mcq')return q.opts[a];
  if(!q.off&&q.type==='tf')return a==='1'?'صح':'خطأ';
  if(!q.off&&q.type==='match')return q.pairs.map((p,i)=>p[0]+' ← '+(a[i]||'—')).join('، ');

}
function solHTML(q){

function stats(){
  const all=[...LOOK.values()],off=all.filter(q=>q.off),gen=all.filter(q=>!q.off);
  const m2=MEMALL.filter(x=>S.mem[x.id]===2).length,m1=MEMALL.filter(x=>S.mem[x.id]===1).length;
  const offSolved=off.filter(q=>recOf(q.id).s).length,offOK=off.filter(q=>recOf(q.id).lc===true).length,offBad=off.filter(q=>recOf(q.id).lc===false).length;
  let R=0,W=0;all.forEach(q=>{const r=recOf(q.id);R+=r.r||0;W+=r.w||0});
  const genDone=gen.filter(q=>(recOf(q.id).r||0)>0).length;
  const ld=LESSONS.filter(l=>S.lessons[l.id]).length;
  const act=all.filter(q=>isMist(recOf(q.id))).length;
  const comp=Math.round(ld/5*20+m2/MEMALL.length*25+offSolved/off.length*30+genDone/gen.length*25);
  return {off,gen,m2,m1,offSolved,offOK,offBad,R,W,genDone,ld,act,comp};
}
function lessonStat(l){
  const qs=[...LOOK.values()].filter(q=>q.lesson===l);let r=0,w=0;qs.forEach(q=>{const x=recOf(q.id);r+=x.r||0;w+=x.w||0});
  const mi=MEMALL.filter(x=>x.lesson===l),m2=mi.filter(x=>S.mem[x.id]===2).length;
  const off=qs.filter(q=>q.off),gen=qs.filter(q=>!q.off);
  return {r,w,att:r+w,acc:pct(r,r+w),mi:mi.length,m2,off:off.length,offS:off.filter(q=>recOf(q.id).s).length,gen:gen.length,genD:gen.filter(q=>(recOf(q.id).r||0)>0).length};
}

function offList(){
  const f=S.f.off,qn=nz(f.q);

    if(f.lesson!=='all'&&q.lesson!==f.lesson)return false; if(f.src!=='all'&&q.src!==f.src)return false;
    if(f.st==='new'&&r.s)return false; if(f.st==='ok'&&r.lc!==true)return false; if(f.st==='bad'&&r.lc!==false)return false;
    if(f.st==='d'&&!r.d)return false; if(f.st==='v'&&!r.v)return false; if(f.st==='nu'&&!(r.s&&!r.u))return false;

/* ============ التعرّف البصري ============ */
const RULES={normal:'شد ← الجدار المعلق للأسفل ← لا تتكرر الطبقات ← يزيد مساحة القشرة',reverse:'ضغط ← الجدار المعلق للأعلى ← تتكرر الطبقات ← يقلل مساحة القشرة',strike:'قص ← حركة أفقية جانبية ← مستوى الصدع رأسي غالباً',graben:'صدعان عاديان متقابلان ← الكتلة بينهما تهبط ← جدار معلق مشترك',horst:'صدعان عاديان متقابلان ← الكتلة بينهما تبرز ← جدار قدم مشترك',step:'صدوع عادية متوازية ← كتل بشكل الأدراج',anticline:'تقوس للأعلى ← الجناحان بعيداً عن المستوى المحوري ← الأقدم في المركز',syncline:'تقوس للأسفل ← الجناحان نحو المستوى المحوري ← الأحدث في المركز',sym:'مستوى محوري عمودي 90° ← جناحان بميل متساوٍ',asym:'مستوى محوري مائل (أقل من 90°) ← ميل الجناحين مختلف',overturned:'جناحان يميلان في الاتجاه نفسه ← أحدهما أكبر من 90° ← طبقات مقلوبة',recumbent:'مستوى محوري أفقي تقريباً',dome:'طبقات تميل بعيداً عن المركز ← الأقدم في المركز',basin:'طبقات تميل نحو المركز ← الأحدث في المركز'};

}

/* ============ التنقّل والعرض ============ */
const TABS=[['dash','لوحة المتابعة',vDash],['learn','أ. تعلّم',vLearn],['mem','ب. احفظ',vMem],['official','ج. أسئلة الكتاب',vOff],['practice','د. تدرّب واختبر',vPractice],['mistakes','هـ. أخطائي',vMist],['visual','تعرّف بصرياً',vVis]];
function updateChrome(){
  const st=stats();const b=$('#hp');if(b){b.style.width=st.comp+'%';$('#hpn').textContent=st.comp+'%'}
  const mb=$('#tab-mistakes .bd');const t=$('#tab-mistakes');if(t){t.innerHTML='هـ. أخطائي'+(st.act?`<span class="bd">${st.act}</span>`:'')}
}
function render(){
  const tab=TABS.find(t=>t[0]===UI.tab)||TABS[0];
  $('#app').innerHTML=tab[2]();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.go===UI.tab?'page':'false'));
  updateChrome();
}
function go(t){const [tab,arg]=t.split(':');
  if(arg){if(tab==='learn')UI.lesson=arg;else if(tab==='mem'){S.f.mem.lesson=arg;UI.memTab='cards';UI.cards.i=0}else if(tab==='official'){S.f.off.lesson=arg;UI.page.off=0}else if(tab==='practice'){S.f.pr.lesson=arg;UI.prTab='bank';UI.page.pr=0}save()}
  UI.tab=tab;if(location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);render();window.scrollTo(0,0);}
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);const b=$('#thm');if(b)b.textContent=S.theme==='auto'?'السمة: تلقائي':S.theme==='dark'?'السمة: داكن':'السمة: فاتح'}

/* ============ الأحداث ============ */
function cardCtx(t){const el=t.closest('.q-card');return el?{el,id:el.dataset.qid,q:LOOK.get(el.dataset.qid)}:null}
function submitCard(c){
  const q=c.q,a=readAns(q,c.el);
  if(isSelf(q)){if(a==null){toast('اكتب محاولتك أولاً أو اضغط «لا أعرف»');return}UI.sub[q.id]={done:true,ans:a,txt:ansText(q,a)};}
  else{if(a==null||(Array.isArray(a)&&q.type!=='fill'&&a.length<(q.pairs?q.pairs.length:q.task?q.task.parts.length:1))){toast('أكمل الإجابة أولاً');return}
    const ok=gradeAuto(q,a);const txt=ansText(q,a);UI.sub[q.id]={done:true,graded:true,correct:ok,ans:a,txt};record(q.id,ok,txt);}
  refreshCard(q.id);
}
function act(a,t,e){
  const d=t.dataset;
  switch(a){
   case 'go':go(d.go);break;
   case 'submit':{const c=cardCtx(t);if(c)submitCard(c);break}
   case 'idk':{const c=cardCtx(t);if(!c)break;UI.sub[c.id]={done:true,graded:true,correct:false,ans:null,txt:'(لا أعرف)'};record(c.id,false,'(لا أعرف)');refreshCard(c.id);break}
   case 'grade':{const c=cardCtx(t);if(!c)break;const st=UI.sub[c.id];const ok=d.v==='1';st.graded=true;st.correct=ok;record(c.id,ok,st.txt);refreshCard(c.id);break}
   case 'retry':{const c=cardCtx(t);if(!c)break;delete UI.sub[c.id];refreshCard(c.id);break}
   case 'tg':{const c=cardCtx(t);if(!c)break;const r=S.q[c.id]||(S.q[c.id]={w:0,r:0});r[d.k]=!r[d.k];if(d.k==='d'&&r.d)r.v=true;save();refreshCard(c.id);if(UI.tab==='mistakes')render();break}
   case 'dismiss':{const c=cardCtx(t);if(!c)break;const r=S.q[c.id]||{};r.d=false;r.v=false;if(r.w>0)r.res=true;S.q[c.id]=r;save();render();break}
   case 'lsn':UI.lesson=d.id;render();window.scrollTo(0,0);break;
   case 'done':S.lessons[d.id]=!S.lessons[d.id];save();render();break;
   case 'mtab':UI.memTab=d.id;UI.cards.flip=false;UI.cards.res=null;render();break;
   case 'cdir':UI.cards.dir=d.id;UI.cards.flip=false;UI.cards.res=null;UI.cards.i=0;render();break;
   case 'flip':UI.cards.flip=true;render();break;
   case 'chk':{const v=($('#cardIn')||{}).value||'';const x=deck()[UI.cards.i];const a=stripAl(nz(v)),b=stripAl(nz(x.term));UI.cards.res=!!a&&(a===b||(a.length>=4&&(b.includes(a)||a.includes(b))));render();break}
   case 'chkidk':UI.cards.res=false;render();break;
   case 'rate':S.mem[d.id]=+d.v;save();UI.cards.flip=false;UI.cards.res=null;if(S.f.mem.st==='all')UI.cards.i++;render();break;
   case 'cnext':UI.cards.i++;UI.cards.flip=false;UI.cards.res=null;render();break;
   case 'cprev':UI.cards.i=Math.max(0,UI.cards.i-1);UI.cards.flip=false;UI.cards.res=null;render();break;
   case 'ms':S.mem[d.id]=+d.v;save();render();break;
   case 'sd':UI.sd[d.id]=!UI.sd[d.id];render();break;
   case 'rv':(UI.rv[d.id]||(UI.rv[d.id]=new Set())).add(d.k);render();break;
   case 'rvall':{const c=COMPARES.find(x=>x.id===d.id),s=UI.rv[d.id]=new Set();c.rows.forEach((r,ri)=>r.slice(1).forEach((_,ci)=>s.add(ri+'-'+ci)));render();break}
   case 'pg':UI.page[d.k]=+d.i;render();window.scrollTo(0,0);break;
   case 'ptab':UI.prTab=d.id;render();break;
   case 'msf':S.f.ms=d.id;save();render();break;
   case 'vtab':UI.visTab=d.id;render();break;
   case 'vznext':pickVz();render();break;
   case 'exl':{const s=UI.examCfg.lessons;s.has(d.id)?s.delete(d.id):s.add(d.id);render();break}
   case 'exstart':{
     const pool=BANK.filter(b=>UI.examCfg.lessons.has(b.lesson)).map(b=>b.id);if(!pool.length){toast('اختر درساً واحداً على الأقل');break}
     for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
     const qs=pool.slice(0,UI.examCfg.n).sort((a,b)=>LOOK.get(a).level-LOOK.get(b).level);
     UI.exam={qs,i:0,ans:{},phase:'run',marks:{}};render();window.scrollTo(0,0);break}
   case 'exnext':case 'exprev':case 'exfin':{
     const E=UI.exam,q=LOOK.get(E.qs[E.i]);const ans=readAns(q,$('#examQ'));if(ans!=null)E.ans[q.id]=ans;else delete E.ans[q.id];
     if(a==='exnext')E.i++;else if(a==='exprev')E.i--;else E.phase='grade';
     render();window.scrollTo(0,0);break}
   case 'exquit':UI.exam=null;render();break;
   case 'xmark':UI.exam.marks[d.id]=d.v==='1';render();break;
   case 'exresult':{const E=UI.exam;let sc=0;E.qs.forEach(id=>{const q=LOOK.get(id),a=E.ans[id];const ok=isSelf(q)?E.marks[id]:gradeAuto(q,a);if(ok)sc++;record(id,!!ok,ansText(q,a))});
     S.exams.push({t:Date.now(),n:E.qs.length,s:sc,p:pct(sc,E.qs.length)});S.exams=S.exams.slice(-20);save();E.phase='result';render();window.scrollTo(0,0);break}
   case 'exdone':UI.exam=null;render();break;
   case 'copyexp':{const b=$('#expBox');b.select();try{navigator.clipboard.writeText(b.value).then(()=>toast('تم النسخ'),()=>{document.execCommand&&document.execCommand('copy');toast('تم التحديد: انسخه يدوياً')})}catch(_){toast('تم التحديد: انسخه يدوياً')}break}
   case 'imp':{try{const o=JSON.parse(($('#impBox').value||'').trim());if(!o||typeof o!=='object'||!o.q)throw 0;S=Object.assign(DEF(),o);save();applyTheme();render();toast('تم الاستيراد')}catch(_){toast('نص غير صالح')}break}
   case 'reset':{if(t.dataset.arm){S=DEF();save();applyTheme();UI.sub={};render();toast('تم المسح')}else{t.dataset.arm='1';t.textContent='اضغط مرة أخرى للتأكيد'}break}
  }
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t,e)});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-chg]');if(!t)return;const v=t.value,k=t.dataset.chg;
  if(k==='of-lesson'){S.f.off.lesson=v;UI.page.off=0}else if(k==='of-src'){S.f.off.src=v;UI.page.off=0}else if(k==='of-st'){S.f.off.st=v;UI.page.off=0}
  else if(k==='pf-lesson'){S.f.pr.lesson=v;UI.page.pr=0}else if(k==='pf-type'){S.f.pr.type=v;UI.page.pr=0}else if(k==='pf-level'){S.f.pr.level=v;UI.page.pr=0}
  else if(k==='mf-lesson'){S.f.mem.lesson=v;UI.cards.i=0;UI.page.fill=0}else if(k==='mf-st'){S.f.mem.st=v;UI.cards.i=0}
  else if(k==='exn'){UI.examCfg.n=+v;return}else if(k==='vzg'){UI.vzGroup=v;UI.vz=null}
  else if(k==='fig'){S.figs[t.dataset.id]=t.checked;save();render();return}
  save();render();
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&t.dataset.inp==='of-q'){S.f.off.q=t.value;UI.page.off=0;save();$('#offRes').innerHTML=offRes()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input.blank, #cardIn[type=text]')){e.preventDefault();if(e.target.id==='cardIn')act('chk',e.target,e);else{const c=cardCtx(e.target);if(c&&!UI.sub[c.id])submitCard(c)}}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==UI.tab){UI.tab=h;render()}});

/* ============ الإقلاع ============ */
function boot(){
  $('#root').innerHTML=`<header class="hdr"><div class="hdr-in"><div class="hdr-top"><h1>الوحدة الثالثة: التراكيب الجيولوجية<small>علوم الأرض والبيئة · الصف الثاني عشر الأكاديمي · نظام دراسة للامتحان الوزاري</small></h1>
   <div class="hdr-prog" title="إنجاز الوحدة"><div class="pbar"><i id="hp"></i></div><b id="hpn">0%</b></div><button class="ic" id="thm"></button></div>
   <nav class="tabs" aria-label="الأقسام">${TABS.map(t=>`<button class="tab" id="tab-${t[0]}" data-act="go" data-go="${t[0]}">${t[1]}</button>`).join('')}</nav></div></header><main id="app"></main>`;
  document.querySelectorAll('.tab').forEach(b=>b.dataset.go=b.id.slice(4));
  $('#thm').onclick=()=>{S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]||'auto';save();applyTheme()};
  applyTheme();
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))UI.tab=h;
  render();
}
boot();
})();


</script>
