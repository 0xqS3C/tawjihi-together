<script>
/*DATA-START*/
const squash=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function variants(a){const o=[a];if(a.indexOf('(')>=0){o.push(a.replace(/\([^)]*\)/g,''));o.push(a.replace(/[()]/g,''));}return o.map(squash).filter(Boolean);}
const ITEMS={},EXS=[],VGROUPS=[],GRULES=[];
function reg(it){it.acc=new Set();(it.answers||[]).concat(it.alts||[]).forEach(a=>variants(a).forEach(v=>it.acc.add(v)));ITEMS[it.key]=it;return it;}
function grade(it,val){
  val=String(val==null?'':val).trim(); if(!val) return false;
  if(it.kind==='letter'||it.kind==='cat') return val===it.answers[0];
  if(it.kind==='num') return Number(val)===Number(it.answers[0]);
  const s=squash(val); if(it.sw&&s.indexOf(it.sw)===0) return true;
  return it.acc.has(s);
}
function ansList(it){if(it.show) return [].concat(it.show); if(it.kind==='letter') return [it.answers[0].toUpperCase()+(it.txt?' — '+it.txt:'')]; return it.answers;}

const LESSONS={SB1A:"Student's Book 1A · Vocabulary & Speaking (pp. 26–27)",SB2A:"Student's Book 2A · The Art of Persuasion (p. 28)",SB3A:"Student's Book 3A · Speaking & Haggling (p. 29)",SB4A:"Student's Book 4A · Reading, Behavioural Economics (pp. 30–31)",SB5A:"Student's Book 5A · Grammar, The Passive (pp. 32–33)",SB6A:"Student's Book 6A · Collocations (pp. 34–35)",WB1B:"Workbook 1B · Business Vocabulary (pp. 20–21)",WB2B:"Workbook 2B · Listening & Lexis (p. 22)",WB5B:"Workbook 5B · Grammar, The Passive (pp. 23–24)",WBREV:"Workbook · Unit 3 Revision (pp. 25–27)",RES:"Teacher's Resources (Unit 3)"};
const GAPS=[
 {l:'ALL',t:"Some activities are open-ended or lack a fixed answer key in the supplied compendium. Those are labelled as self-check prompts rather than invented answer-key questions."},
 {l:'SB2A',t:"The full audio recordings/transcripts are not reproduced; listening prompts are based only on the supplied compendium."},
 {l:'SB3A',t:"Ex 2 has only a one-line summary of each dialogue. No dialogue text, no questions."},
 {l:'SB4A',t:"The reading text and Ex 1 are not in claude.md."},
 {l:'SB5A',t:"Only Ex 4, 5, 7, 8 and 9 are in claude.md."},
 {l:'SB6A',t:"Only Ex 2 (collocations) is included. Academic writing is left out, as you asked."},
 {l:'WB1B',t:"Ex 6, item 1: the answer is not in claude.md."},
 {l:'WB2B',t:"Only Ex 1 is in claude.md."},
 {l:'WB5B',t:"Ex 3 (matching reasons a–f) has no answers in claude.md. Ex 7, item 1 has no answer. Ex 1, 5 and 6 are not included."},
 {l:'WBREV',t:"The Ex 4 reading text is not in claude.md."},
 {l:'RES',t:"Resource 8 and 9 are word lists with no answer key, so they are not drilled. Resource 10 has only item 1."}
];
const NQ="The question text isn't in claude.md. Use your book, then type the official answer.";
const T=(a,x)=>Object.assign({kind:'text',answers:[a]},x);
const L=(a,opts,x)=>Object.assign({kind:'letter',answers:[a],opts:opts},x);
const C=(a,opts,x)=>Object.assign({kind:'cat',answers:[a],opts:opts},x);
const N=(a,x)=>Object.assign({kind:'num',answers:[String(a)]},x);
const Sn=(a,x)=>Object.assign({kind:'sentence',answers:[].concat(a)},x);
function addEx(o){
  const keys=o.items.map((raw,i)=>{
    const n=raw.n!=null?raw.n:i+1;
    const it=Object.assign({kind:'text',note:o.note||''},raw);
    it.key=o.id+'#'+n; it.n=n; it.type='ex'; it.ex=o.id; it.lesson=o.lesson; it.tag=o.short+' · item '+n;
    it.prompt=raw.p||(o.prompt?o.prompt(n):o.short+', item '+n);
    reg(it); return it.key;});

}

addEx({id:'SB3A2',lesson:'SB3A',short:'SB 3A · Ex 2',title:'Ex 2 · Dialogue details',note:'Only a one-line summary of each dialogue is in claude.md. Answer it, reveal it, then rate yourself.',

        {kind:'self',answers:['Landlord and prospective tenant negotiating rental terms and discounts.'],p:'Dialogue 2: who is speaking and what is the topic?'}]});

addEx({id:'SB5A8',lesson:'SB5A',short:'SB 5A · Ex 8',title:'Ex 8 · Passive transformations',note:'The active sentences are in your book. Write the passive from them, or type "not possible".',prompt:n=>'Ex 8, item '+n+': write the passive sentence, or "not possible".',

const GP=function(id,list){return list.map(function(r,i){const it=Object.assign({key:'G:'+id+'#'+(i+1),type:'gram',lesson:'GRAM',kind:'sentence',note:'Tutor practice, not from your textbook.',tag:'Grammar · '+id+' · '+(i+1)},r);it.prompt=r.p;reg(it);return it.key;});};
const CAT_WHY=['Agent unknown','Agent obvious','Avoids blame','Impersonal / objective'];
GRULES.push({id:'why',title:'Why use the passive',src:'Grammar Reference, section 5.1',
 explain:['Focus on the action or the receiver, not the doer.','Agent unknown ("My wallet was stolen last night") or obvious ("All shoplifters will be prosecuted").','Impersonal, objective tone in academic, news and legal writing ("It is believed that…").','Avoids personal blame: "A terrible mistake was made."','Puts new or heavy information at the end of the sentence (end-weight).','Avoids starting a sentence with a long, clumsy subject clause.'],
 formula:'Add "by + agent" only when the agent is new or important information.',
 examples:['My wallet was stolen last night. (agent unknown)','All shoplifters will be prosecuted. (agent obvious)','A terrible mistake was made. (avoids blame)'],
 mistakes:['Adding "by the police" when the agent is obvious.','Adding "by someone" when the agent is unknown.'],
 keys:GP('why',[
  {p:'"My wallet was stolen last night." Main reason for the passive?',kind:'cat',opts:CAT_WHY,answers:['Agent unknown']},
  {p:'"All shoplifters will be prosecuted." Main reason for the passive?',kind:'cat',opts:CAT_WHY,answers:['Agent obvious']},
  {p:'"A terrible mistake was made." Main reason for the passive?',kind:'cat',opts:CAT_WHY,answers:['Avoids blame']},
  {p:'"It is believed that animals never fall into the trap of the sunk-cost fallacy, only humans." Main reason?',kind:'cat',opts:CAT_WHY,answers:['Impersonal / objective']}])});
GRULES.push({id:'form',title:'Forming the passive',src:'Grammar Reference, sections 5.1 and 5.3 plus your answer keys',
 explain:['The object of the active verb becomes the subject.','Use "be" in the same tense as the active verb, then the past participle.','Add "by + agent" only when it is needed.'],
 formula:'Object + be (same tense as the active verb) + past participle (+ by agent)',
 examples:['Present simple: is/are + pp → Economics is used…','Past simple: was/were + pp → A terrible mistake was made.','Present perfect: has/have been + pp → 82 percent of consumers have been convinced…','Past perfect: had been + pp → Too much salt had been added to the food.','Future: will be + pp → The minor issues will be ironed out.','Present continuous: is/are being + pp → Pedestrianisation is being considered.'],
 mistakes:['Dropping "been" in perfect tenses: has ordered ✗, has been ordered ✓.','Using the base form: "is make" ✗, "is made" ✓ (Resource 10, item 1).','Changing the tense when you switch to the passive.'],
 keys:GP('form',[
  {p:'Active: "They have cancelled the sale." Write the passive.',answers:['The sale has been cancelled.'],alts:['The sale has been canceled.'],why:'Present perfect: has cancelled becomes has been cancelled.'},
  {p:'Active: "The manager sacked the assistant." Write the passive with the agent.',answers:['The assistant was sacked by the manager.'],why:'Past simple: was + past participle, then by + agent.'},
  {p:'Active: "Staff are checking the stock." Write the passive without the agent.',answers:['The stock is being checked.'],alts:['The stock is being checked by staff.'],why:'Present continuous: is being + past participle.'},
  {p:'Active: "The bank had sent warnings." Write the passive.',answers:['Warnings had been sent by the bank.'],alts:['Warnings had been sent.'],why:'Past perfect: had been + past participle.'}])});
GRULES.push({id:'two',title:'Verbs with two objects',src:'Grammar Reference, section 5.2',
 explain:['Verbs: give, lend, owe, promise, send, offer, award, sell, show, buy.','Pattern A (common): the person (indirect object) becomes the subject.','Pattern B (emphatic): the thing (direct object) becomes the subject, then to/for + person.','English puts known information first and the newest information last.'],
 formula:'A: Person + be + pp + thing\nB: Thing + be + pp + to + person',
 examples:['They lent us the money.','A → We were lent the money.','B → The money was lent to us.','Sameer will probably be given the job. (A)','He has just been awarded a promotion. (A)'],
 mistakes:['Forgetting "to" in pattern B: "The money was lent us" ✗.','Putting "to" into pattern A.'],
 keys:GP('two',[
  {p:'Pattern A. Active: "They offered her the job."',answers:['She was offered the job.']},
  {p:'Pattern B. Active: "They sent the board the report."',answers:['The report was sent to the board.']},
  {p:'Pattern A. Active: "They will give the staff a bonus."',answers:['The staff will be given a bonus.']},
  {p:'Pattern B. Active: "They showed us the plan."',answers:['The plan was shown to us.']}])});
GRULES.push({id:'imp',title:'Impersonal passive',src:'Grammar Reference, section 5.3',
 explain:['Reporting verbs: believe, consider, expect, report, say, think, understand.','Pattern 1: It + be + pp + that-clause.','Pattern 2: Subject + be + pp + to-infinitive.'],
 formula:'It is thought that + clause\nSubject is thought to + infinitive',
 examples:['It is thought that shopping will always remain a social experience.','Shopping is thought to be an enduring social experience.'],
 mistakes:['Mixing the patterns: "It is thought to be…" ✗.','Using an active reporting verb: "It thinks that…" ✗.'],
 keys:GP('imp',[
  {p:'Rewrite with "It": "People believe that prices will rise."',answers:['It is believed that prices will rise.']},
  {p:'Rewrite with "to": "People say that online shopping is growing."',answers:['Online shopping is said to be growing.'],alts:['Online shopping is said to grow.']},
  {p:'Rewrite with "It": "Experts expect that sales will fall."',answers:['It is expected that sales will fall.']}])});
GRULES.push({id:'phr',title:'Prepositional and phrasal verbs',src:'Grammar Reference, section 5.4',
 explain:['The preposition or particle stays directly after the past participle.','This works for phrasal verbs and prepositional verbs.'],
 formula:'Object + be + pp + particle/preposition',
 examples:['They broke into the warehouse. → The warehouse was broken into.','We must iron out the minor issues. → The minor issues will be ironed out.'],
 mistakes:['Dropping the particle: "The warehouse was broken" ✗.','Moving the particle: "The issues were out ironed" ✗.'],
 keys:GP('phr',[
  {p:'"They looked into the complaint." Write the passive.',answers:['The complaint was looked into.']},
  {p:'"We will sort out the details." Write the passive.',answers:['The details will be sorted out.']},
  {p:'"They have called off the sale." Write the passive.',answers:['The sale has been called off.']}])});
GRULES.push({id:'no',title:'When no passive is possible',src:'Your answer key, SB 5A Ex 8 items 3 and 6',
 explain:['Only transitive verbs (verbs with a direct object) have a passive.','Intransitive verbs (happen, arrive, end, be) and linking verbs (be, seem, become) cannot be passive.'],
 formula:'No direct object → no passive',
 examples:["Not possible: verb 'be' is intransitive.","Not possible: linking verb 'is' has no direct object."],
 mistakes:['Forcing a passive out of "is" or "was".','Passivising a verb that has no object.'],
 keys:GP('no',[
  {p:'"They sold the house." Can it become passive?',kind:'cat',opts:['Possible','Not possible'],answers:['Possible']},
  {p:'"The price is too high." Can it become passive?',kind:'cat',opts:['Possible','Not possible'],answers:['Not possible'],why:'"Is" is a linking verb with no direct object.'},
  {p:'"The sale ends today." Can it become passive?',kind:'cat',opts:['Possible','Not possible'],answers:['Not possible'],why:'"End" is intransitive here: no object.'},
  {p:'"The bank sent warnings." Can it become passive?',kind:'cat',opts:['Possible','Not possible'],answers:['Possible']}])});

/*DATA-END*/

/* ---------- state ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const fresh=()=>({startedAt:null,items:{},review:[],tab:'study',block:'vocab',final:null,timerMode:'stopwatch',timerElapsedMs:0,timerRunAt:null,pomoPhase:'work',pomoRound:1,pomoRemainingMs:25*60*1000});
let ST;try{ST=Object.assign(fresh(),JSON.parse(localStorage.getItem('hs3-drill')||'{}'))}catch(e){ST=fresh()}
function save(){try{localStorage.setItem('hs3-drill',JSON.stringify(ST))}catch(e){}}
ST.review=Array.isArray(ST.review)?ST.review:[];
let ENG=null,VL=null,GR=0,RESET=false;
const BLOCKS=[
 {id:'vocab',s:0,e:20,name:'Vocabulary',kind:'vocab'},
 {id:'sb1',s:20,e:35,name:"SB 1A · 2A · 3A",kind:'ex',lessons:['SB1A','SB2A','SB3A']},
 {id:'sb2',s:35,e:50,name:"SB 4A · 5A · 6A",kind:'ex',lessons:['SB4A','SB5A','SB6A']},
 {id:'wb1',s:50,e:65,name:'WB 1B · 2B',kind:'ex',lessons:['WB1B','WB2B']},
 {id:'gram',s:65,e:85,name:'Grammar + WB 5B',kind:'gram',lessons:['WB5B']},
 {id:'wb2',s:85,e:105,name:'WB revision',kind:'ex',lessons:['WBREV','RES']},
 {id:'recall',s:105,e:115,name:'Answer recall',kind:'recall'},
 {id:'final',s:115,e:120,name:'Final test',kind:'final'}];
const rec=k=>ST.items[k];
function status(k){const r=rec(k);if(!r)return 'new';if(r.last==='w')return 'weak';return r.w>0?'shaky':'strong'}
function record(k,ok){const r=ST.items[k]||(ST.items[k]={r:0,w:0,last:null});if(ok)r.r++;else r.w++;r.last=ok?'r':'w';save()}
const exKeys=()=>EXS.reduce((a,e)=>a.concat(e.keys),[]);
const vocKeys=()=>VGROUPS.reduce((a,g)=>a.concat(g.keys),[]);
const gramKeys=()=>GRULES.reduce((a,g)=>a.concat(g.keys),[]);
const unresolved=()=>Object.keys(ITEMS).filter(k=>rec(k)&&rec(k).last==='w');
const runningMs=()=>ST.timerElapsedMs+(ST.timerRunAt?Date.now()-ST.timerRunAt:0);
const elapsed=()=>runningMs()/60000;
function curBlock(){if(!ST.timerRunAt&&ST.timerElapsedMs===0)return null;const m=elapsed();if(m>=120)return 'over';return BLOCKS.find(b=>m>=b.s&&m<b.e)}
function clockText(ms){const sec=Math.max(0,Math.floor(ms/1000));return Math.floor(sec/60)+':'+pad(sec%60)}
function startTimer(){if(ST.timerRunAt)return;ST.timerRunAt=Date.now();ST.startedAt=ST.startedAt||ST.timerRunAt;save();tick()}
function pauseTimer(){if(!ST.timerRunAt)return;const now=Date.now(),delta=now-ST.timerRunAt;ST.timerElapsedMs+=delta;if(ST.timerMode==='pomodoro')ST.pomoRemainingMs=Math.max(0,ST.pomoRemainingMs-delta);ST.timerRunAt=null;save();tick()}
function nextPomoPhase(){if(ST.pomoPhase==='work'){if(ST.pomoRound>=4){ST.pomoPhase='long';ST.pomoRemainingMs=15*60*1000}else{ST.pomoPhase='short';ST.pomoRemainingMs=5*60*1000}}else if(ST.pomoPhase==='long'){ST.pomoPhase='work';ST.pomoRound=1;ST.pomoRemainingMs=25*60*1000}else{ST.pomoPhase='work';ST.pomoRound++;ST.pomoRemainingMs=25*60*1000}}
const pad=n=>String(n).padStart(2,'0');

/* ---------- stopwatch & pomodoro ---------- */
function buildTimeline(){$('#tl').innerHTML=BLOCKS.map(b=>'<div class="seg" data-id="'+b.id+'" style="flex:'+(b.e-b.s)+'"><i></i></div>').join('')}
function tick(){
  const now=Date.now();
  if(ST.timerMode==='pomodoro'&&ST.timerRunAt){
    const left=ST.pomoRemainingMs-(now-ST.timerRunAt);
    if(left<=0){ST.timerElapsedMs+=now-ST.timerRunAt;ST.timerRunAt=now;nextPomoPhase();save();}
  }
  const elapsedMs=runningMs(),m=elapsedMs/60000;
  const clock=ST.timerMode==='pomodoro'?Math.max(0,ST.pomoRemainingMs-(ST.timerRunAt?now-ST.timerRunAt:0)):elapsedMs;
  $('#clock').textContent=clockText(clock);
  const isRunning=!!ST.timerRunAt;
  $('#tagl').textContent=ST.timerMode==='stopwatch'?'Stopwatch':(ST.pomoPhase==='work'?'Focus session':'Break');
  const sb=$('#startbtn');sb.textContent=isRunning?'Pause':'Start';
  document.querySelectorAll('[data-act="timerMode"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===ST.timerMode)));
  const ps=$('#pomo-settings');if(ps)ps.hidden=ST.timerMode!=='pomodoro';
  const phase=$('#pomo-phase');if(phase)phase.textContent=(ST.pomoPhase==='work'?'Work':ST.pomoPhase==='short'?'Short break':'Long break')+' · '+ST.pomoRound+'/4';
  const cb=curBlock();
  document.querySelectorAll('.seg').forEach(s=>{const b=BLOCKS.find(x=>x.id===s.dataset.id);const f=Math.min(1,Math.max(0,(m-b.s)/(b.e-b.s)));s.firstElementChild.style.width=(f*100)+'%';s.classList.toggle('cur',cb&&cb!=='over'&&cb.id===b.id)});
  const nd=$('#nudge');
  if(cb&&cb!=='over'&&cb.id!==ST.block){const h='<div class="n"><span>Schedule now: <b>'+pad(cb.s)+'–'+pad(cb.e)+' '+esc(cb.name)+'</b></span><button class="btn sm" data-act="goblock" data-id="'+cb.id+'">Switch</button></div>';if(nd.dataset.k!==cb.id){nd.innerHTML=h;nd.dataset.k=cb.id}}
  else if(cb==='over'){if(nd.dataset.k!=='over'){nd.innerHTML='<div class="n"><span><b>120 minutes are up.</b> Open the Report tab for your result.</span><button class="btn sm" data-tab="report">Report</button></div>';nd.dataset.k='over'}}
  else if(nd.dataset.k){nd.innerHTML='';nd.dataset.k=''}
  if(ENG&&ENG.deadline){const left=Math.max(0,Math.ceil((ENG.deadline-now)/1000));const fc=$('#fclock');if(fc)fc.textContent=Math.floor(left/60)+':'+pad(left%60);if(left===0&&!ENG.done)finishEngine()}
}

/* ---------- engine ---------- */
function startEngine(cfg){
  ENG=Object.assign({mode:'learn',tab:ST.tab},cfg);
  ENG.queue=cfg.mode==='final'||cfg.noShuffle?cfg.keys.slice():cfg.keys.slice();
  ENG.pos=0;ENG.stage='ask';ENG.first={};ENG.redo={};ENG.hint=false;ENG.rc=0;ENG.last=null;ENG.done=false;
  if(cfg.mode==='final')ENG.deadline=Date.now()+5*60000;
  render();tick();
}
function grabInput(){const a=$('#ans');return a?a.value:''}
function submit(val){
  const E=ENG,it=ITEMS[E.queue[E.pos]];
  const ok=grade(it,val),hinted=E.hint,counted=ok&&!hinted;E.hint=false;
  record(it.key,counted);
  if(!E.first[it.key])E.first[it.key]={ok:counted,val:val};
  if(E.mode==='final'){advance();return}
  E.last={ok:ok,hinted:hinted,val:val};E.stage='fb';
  if(!counted)requeue(it.key);
  render();
}
function requeue(k){const E=ENG;E.redo[k]=(E.redo[k]||0)+1;if(E.redo[k]<=2)E.queue.splice(Math.min(E.pos+5,E.queue.length),0,k)}
function advance(){const E=ENG;E.pos++;E.stage='ask';E.hint=false;E.rc=0;E.last=null;if(E.pos>=E.queue.length&&E.mode==='final'){finishEngine();return}render()}
function finishEngine(){
  const E=ENG;if(!E||E.done)return;E.done=true;
  if(E.mode==='final'){
    const all=E.keys;const ok=all.filter(k=>E.first[k]&&E.first[k].ok).length;
    all.forEach(k=>{if(!E.first[k]){E.first[k]={ok:false,val:''};record(k,false)}});
    ST.final={ts:Date.now(),score:ok,total:all.length,pct:Math.round(ok/all.length*100)};save();
  }
  E.pos=E.queue.length;render();
}
function recallSubmit(val){
  const E=ENG,it=ITEMS[E.queue[E.pos]];
  if(grade(it,val)){E.stage='rcok'}else{E.rc++;E.last={val:val}}
  render();
}
function diffs(user,off){
  const tok=s=>s.trim().split(/\s+/).filter(Boolean);
  const a=tok(user),b=tok(off),A=a.map(squash),B=b.map(squash),m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=(A[i]&&A[i]===B[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;const u=[],o=[];
  while(i<m&&j<n){if(A[i]&&A[i]===B[j]){u.push(esc(a[i]));o.push(esc(b[j]));i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){u.push('<del>'+esc(a[i])+'</del>');i++}else{o.push('<mark>'+esc(b[j])+'</mark>');j++}}
  while(i<m){u.push('<del>'+esc(a[i++])+'</del>')}while(j<n){o.push('<mark>'+esc(b[j++])+'</mark>')}
  return {u:u.join(' '),o:o.join(' '),score:dp[0][0]};
}
function diffBlock(it,val){
  let best=null;it.answers.forEach(a=>{const d=diffs(val,a);if(!best||d.score>best.score)best=d});
  return '<div class="df"><div><span class="lbl">Your answer</span>'+best.u+'</div><div><span class="lbl">Official, missing words marked</span>'+best.o+'</div></div>';
}
function officialHTML(it){return '<div class="official"><span class="lbl">Official answer</span>'+ansList(it).map(l=>'<p class="ans">'+esc(l)+'</p>').join('')+'</div>'}
function vocabOptions(it){
  const correct=it.answers[0];
  const pool=it.learnDef
    ? vocKeys().map(k=>ITEMS[k]).filter(x=>x.key!==it.key&&x.learnDef).map(x=>x.answers[0])
    : NEG.map(r=>r[1]).filter(x=>x!==correct);
  const unique=[...new Set(pool)].filter(x=>squash(x)!==squash(correct));
  return shuffle([correct,...shuffle(unique).slice(0,3)]);
}
function inputHTML(it,rc){
  if(ENG.mode==='vocab'&&it.type==='vocab')return '<div class="opts">'+vocabOptions(it).map(o=>'<button class="opt" data-act="pick" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>'+(rc?'':'<div class="row"><button class="btn ghost sm" data-act="skip">Skip</button></div>');
  if(it.kind==='letter'||it.kind==='cat')return '<div class="opts '+it.kind+'">'+it.opts.map(o=>'<button class="opt" data-act="pick" data-v="'+esc(o)+'">'+(it.kind==='letter'?'<span class="mono">'+esc(o.toUpperCase())+'</span>':esc(o))+'</button>').join('')+'</div>'+(rc||ENG.mode==='final'?'':'<div class="row"><button class="btn ghost sm" data-act="skip">Skip</button></div>');
  if(it.kind==='self')return '<div class="row"><button class="btn" data-primary data-act="reveal">Show official answer</button></div>';
  const f=it.kind==='sentence'?'<textarea id="ans" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"></textarea>':'<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer">';
  const hintBtn=(!rc&&it.kind==='text'&&ENG.mode!=='final')?'<button class="btn ghost" data-act="hint">Hint</button>':'';
  const skip=(!rc&&ENG.mode!=='final')?'<button class="btn ghost" data-act="skip">Skip</button>':'';
  return f+'<div class="row"><button class="btn" data-primary data-act="'+(rc?'rcheck':'check')+'">Check</button>'+hintBtn+skip+'</div><p id="hintline" class="mono muted"></p>';
}
function engineHTML(){
  const E=ENG;if(E.pos>=E.queue.length)return summaryHTML();
  const it=ITEMS[E.queue[E.pos]],pct=Math.round(E.pos/E.queue.length*100);
  let h='<div class="eng"><div class="eng-top"><button class="lnk" data-act="exit">← Leave</button><span class="mono muted">'+esc(E.title)+'</span><span class="mono" id="fclock"></span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="card q"><p class="tg">'+esc(it.tag)+' · '+(E.pos+1)+' of '+E.queue.length+'</p><p class="prompt">'+esc(it.prompt)+'</p>';
  if(E.stage==='ask'){if(it.note&&E.mode!=='final')h+='<p class="note">'+esc(it.note)+'</p>';h+=inputHTML(it,false)}
  else if(E.stage==='selfshow'){h+=officialHTML(it)+'<div class="row"><button class="btn" data-act="selfok">I had it</button><button class="btn ghost" data-act="selfmiss">I missed it</button></div>'}
  else if(E.stage==='fb'){
    const L=E.last,counted=L.ok&&!L.hinted;
    h+='<div class="verdict '+(L.ok?'good':'bad')+'">'+(L.ok?(L.hinted?'Correct, but you used the hint, so it counts as a miss.':'Correct'):(L.val?'Not quite':'Skipped'))+'</div>';
    if(!L.ok&&it.kind==='sentence'&&L.val)h+=diffBlock(it,L.val);
    h+=officialHTML(it);if(it.why)h+='<p class="why">'+esc(it.why)+'</p>';
    h+='<div class="row">'+(counted?'<button class="btn" data-primary data-act="next">Next</button>':'<button class="btn" data-primary data-act="cover">Cover it and recall</button>')+'</div>';
  }
  else if(E.stage==='recall'){
    h+='<div class="verdict info">Recall it. The answer is hidden.</div>';
    if(E.rc>0)h+='<div class="verdict bad">Not yet</div>'+(E.rc>=2?officialHTML(it):'');
    h+=inputHTML(it,true);
  }
  else if(E.stage==='rcok'){h+='<div class="verdict good">Recalled correctly. It will come back later in this session.</div>'+officialHTML(it)+'<div class="row"><button class="btn" data-primary data-act="next">Next</button></div>'}
  return h+'</div></div>';
}
function summaryHTML(){
  const E=ENG,keys=Object.keys(E.first),miss=keys.filter(k=>!E.first[k].ok),ok=keys.length-miss.length;
  let h='<div class="stack"><div class="card"><div class="head"><h2>'+(E.mode==='final'?'Final test result':'Set finished')+'</h2><span class="mono muted">'+esc(E.title)+'</span></div><p style="margin-top:10px"><span class="big">'+ok+'/'+keys.length+'</span> <span class="muted">correct on the first try</span></p></div>';
  if(miss.length){h+='<div class="card"><h3>Missed ('+miss.length+')</h3><div style="margin-top:8px">'+miss.map(k=>{const it=ITEMS[k];return '<div class="rowitem"><span class="k">'+esc(it.tag)+'</span><span class="small" style="flex:1 1 220px">'+esc(ansList(it).join('  /  '))+'</span></div>'}).join('')+'</div></div>'}
  h+='<div class="row">'+(miss.length?'<button class="btn" data-act="retrymiss">Retry the misses</button>':'')+(E.next?'<button class="btn" data-act="'+E.next.act+'" data-i="'+E.next.i+'">'+esc(E.next.label)+'</button>':'')+'<button class="btn ghost" data-act="exit">Back</button></div></div>';
  return h;
}

/* ---------- study views ---------- */
function blockPicker(){
  const cb=curBlock();
  return '<div class="picker">'+BLOCKS.map(b=>'<button data-act="goblock" data-id="'+b.id+'" aria-pressed="'+(ST.block===b.id)+'" class="'+(cb&&cb!=='over'&&cb.id===b.id?'now':'')+'"><span class="r">'+pad(b.s)+'–'+pad(b.e)+'</span><span class="n">'+esc(b.name)+'</span></button>').join('')+'</div>';
}
function chipsFor(keys,label){return '<div class="chips">'+keys.map(k=>'<span class="chip '+status(k)+'">'+esc(label(ITEMS[k]))+'</span>').join('')+'</div>'}
function viewVocab(){
  if(VL!==null)return learnHTML();
  const weak=vocKeys().filter(k=>{const s=status(k);return s==='weak'||s==='shaky'});
  let h='<div class="card"><div class="head"><h2>Vocabulary</h2><span class="note">Learn five, then choose the correct word from its definition. Misses come back until they stick.</span></div><div class="row" style="margin-top:12px"><button class="btn" data-act="learn" data-i="'+Math.max(0,VGROUPS.findIndex(g=>g.keys.some(k=>status(k)==='new')))+'">Continue learning</button>'+(weak.length?'<button class="btn ghost" data-act="vweak">Review weak words ('+weak.length+')</button>':'')+'</div></div><div class="grid">';
  VGROUPS.forEach((g,i)=>{const done=g.keys.filter(k=>status(k)==='strong').length;
    h+='<div class="card"><div class="head"><h3>'+(i+1)+'. '+esc(g.name)+'</h3><span class="mono muted small">'+done+'/'+g.keys.length+'</span></div>'+chipsFor(g.keys,it=>it.hint)+'<button class="btn ghost sm" data-act="learn" data-i="'+i+'">Learn and test</button></div>'});
  return h+'</div>';
}
function learnHTML(){
  const g=VGROUPS[VL];
  return '<div class="card stack"><div class="head"><h2>'+esc(g.name)+'</h2><span class="note">Read once, out loud if you can. Then test with multiple choice.</span></div><ul class="list">'+g.keys.map(k=>{const it=ITEMS[k];return g.cloze?'<li>'+esc(it.learnTerm)+'</li>':'<li><b>'+esc(it.learnTerm)+'</b><br><span class="muted">'+esc(it.learnDef)+'</span></li>'}).join('')+'</ul><div class="row"><button class="btn" data-act="vtest">Test me</button><button class="btn ghost" data-act="vback">All groups</button></div></div>';
}
function gapsFor(l){return GAPS.filter(g=>g.l===l).map(g=>'<div class="card dash small"><span class="chip">Not in claude.md</span> '+esc(g.t)+'</div>').join('')}
function viewEx(b){
  const exs=EXS.filter(e=>b.lessons.indexOf(e.lesson)>=0),all=exs.reduce((a,e)=>a.concat(e.keys),[]);
  const todo=all.filter(k=>{const s=status(k);return s==='new'||s==='weak'});
  let h='';
  if(b.kind==='gram')h+='<div class="card"><div class="head"><h2>Passive voice rules</h2><button class="btn" data-tab="grammar">Open grammar</button></div><p class="note" style="margin-top:6px">Six rules with formula, examples, exam mistakes and practice. Do these first, then the Workbook 5B exercises below.</p></div>';
  h+='<div class="card"><div class="head"><h2>'+esc(b.name)+'</h2><span class="mono muted small">'+all.length+' items</span></div><div class="row" style="margin-top:12px"><button class="btn" data-act="runblock" data-id="'+b.id+'">'+(todo.length?'Start ('+todo.length+' left)':'Review all')+'</button></div></div>';
  b.lessons.forEach(l=>{
    h+='<h3 style="margin-top:6px">'+esc(LESSONS[l])+'</h3>';
    exs.filter(e=>e.lesson===l).forEach(e=>{const att=e.keys.filter(k=>rec(k)).length,wk=e.keys.filter(k=>status(k)==='weak').length;
      h+='<div class="card"><div class="head"><h3>'+esc(e.title)+'</h3><span class="mono muted small">'+att+'/'+e.keys.length+(wk?' · '+wk+' weak':'')+'</span></div>'+chipsFor(e.keys,it=>String(it.n))+'<button class="btn ghost sm" data-act="startex" data-id="'+e.id+'">'+(att?'Redo':'Start')+'</button></div>'});
    h+=gapsFor(l);
  });
  return h;
}
function viewRecall(){
  const un=unresolved(),sent=exKeys().filter(k=>ITEMS[k].kind==='sentence'),wv=vocKeys().filter(k=>{const s=status(k);return s==='weak'||s==='shaky'});
  return '<div class="card stack"><h2>Answer-key recall</h2><p class="note">Retest every miss first, then a mixed sample of official answers. Type exact wording. Sentence transformations count most.</p><div class="row"><button class="btn" data-act="recallgo">Start mixed recall ('+un.length+' misses first)</button><button class="btn ghost" data-act="recallsent">All sentence transformations ('+sent.length+')</button>'+(wv.length?'<button class="btn ghost" data-act="vweak">Weak vocabulary ('+wv.length+')</button>':'')+'</div></div>';
}
function viewFinal(){
  return '<div class="card stack"><h2>Final closed-book test</h2><p>20 questions, 5 minutes, no feedback until the end: 8 vocabulary definitions, 4 sentence transformations and 8 other official answers.</p>'+(ST.final?'<p class="note">Last result: <b>'+ST.final.score+'/'+ST.final.total+' ('+ST.final.pct+'%)</b></p>':'')+'<div class="row"><button class="btn" data-act="finalgo">Start final test</button></div></div>';
}
function viewStudy(){
  const b=BLOCKS.find(x=>x.id===ST.block);
  let h=blockPicker();
  if(b.kind==='vocab')h+=viewVocab();else if(b.kind==='recall')h+=viewRecall();else if(b.kind==='final')h+=viewFinal();else h+=viewEx(b);
  if(ST.block==='vocab'&&VL===null)h+=gapsFor('ALL');
  return h;
}

/* ---------- grammar ---------- */
function viewGrammar(){
  const g=GRULES[GR],att=g.keys.filter(k=>rec(k)).length,ok=g.keys.filter(k=>rec(k)&&rec(k).last==='r').length;
  return '<div class="pills">'+GRULES.map((r,i)=>'<button data-act="gr" data-i="'+i+'" aria-pressed="'+(i===GR)+'">'+esc(r.title)+'</button>').join('')+'</div>'+
  '<div class="card stack"><div class="head"><h2>'+esc(g.title)+'</h2><span class="mono muted small">'+esc(g.src)+'</span></div>'+
  '<div><h3>The rule</h3><ul class="list plain" style="margin-top:6px">'+g.explain.map(x=>'<li>• '+esc(x)+'</li>').join('')+'</ul></div>'+
  '<div><h3>Formula</h3><div class="formula" style="margin-top:6px;white-space:pre-line">'+esc(g.formula)+'</div></div>'+
  '<div><h3>Examples</h3><ul class="list" style="margin-top:6px">'+g.examples.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'+
  '<div><h3>Common exam mistakes</h3><ul class="list plain" style="margin-top:6px">'+g.mistakes.map(x=>'<li>⚠ '+esc(x)+'</li>').join('')+'</ul></div>'+
  '<div class="row"><button class="btn" data-act="grpractice">Practice ('+g.keys.length+' questions)</button><span class="note">'+(att?ok+' of '+g.keys.length+' right on your last try':'Not started')+'. Practice questions are tutor-written, not from your textbook.</span></div></div>';
}

/* ---------- mistakes & report ---------- */
function viewMistakes(){
  const marked=ST.review||[];
  const reviewCard='<div class="card"><div class="head"><div><h2>Top revision · '+marked.length+' question'+(marked.length===1?'':'s')+'</h2><p class="note">Questions you manually marked to revise later.</p></div>'+(marked.length?'<button class="btn" data-act="reviewgo">Revise group</button>':'')+'</div>'+(marked.length?marked.map(k=>{const it=ITEMS[k];return '<div class="rowitem"><span class="k">'+esc(it.tag)+'</span><span class="small" style="flex:1 1 180px">'+esc(it.prompt)+'</span><button class="btn ghost sm" data-act="unmark" data-key="'+esc(k)+'">Remove</button></div>'}).join(''):'<p class="note" style="margin-top:8px">Tap “Add to review” on any question while studying to collect it here.</p>')+'</div>';
  const un=unresolved();
  if(!un.length)return reviewCard+'<div class="card"><h2>No open mistakes</h2><p class="note" style="margin-top:6px">Anything you get wrong lands here with its official answer until you answer it correctly again.</p></div>';
  const groups={};un.forEach(k=>{const l=ITEMS[k].type==='vocab'?'Vocabulary':ITEMS[k].type==='gram'?'Grammar practice':LESSONS[ITEMS[k].lesson];(groups[l]=groups[l]||[]).push(k)});
  let h=reviewCard+'<div class="card"><div class="head"><h2>'+un.length+' open mistake'+(un.length>1?'s':'')+'</h2><button class="btn" data-act="retestall">Retest all</button></div></div>';
  Object.keys(groups).forEach(l=>{h+='<div class="card"><h3>'+esc(l)+'</h3><div style="margin-top:6px">'+groups[l].map(k=>{const it=ITEMS[k];return '<div class="rowitem"><span class="k">'+esc(it.tag)+'</span><span class="small" style="flex:1 1 240px"><b>'+esc(ansList(it).join('  /  '))+'</b></span></div>'}).join('')+'</div></div>'});
  return h;
}
function viewReport(){
  const ek=exKeys(),vk=vocKeys(),gk=gramKeys(),un=unresolved();
  const exAtt=ek.filter(k=>rec(k)).length,vAtt=vk.filter(k=>rec(k)).length;
  const done=EXS.filter(e=>e.keys.every(k=>rec(k)));
  const vs={strong:[],shaky:[],weak:[],new:[]};vk.forEach(k=>vs[status(k)].push(ITEMS[k].hint));
  const unEx=un.filter(k=>ITEMS[k].type==='ex');
  const cov=exAtt/ek.length;
  let verdict,detail;
  if(!ST.final){verdict='Not assessed yet';detail='Take the final test in the last block to get a real readiness score.'}
  else if(ST.final.pct>=85&&unEx.length<=5&&cov>=.9){verdict='Ready';detail='Final test '+ST.final.pct+'%, exercise coverage '+Math.round(cov*100)+'%, '+unEx.length+' official answers still open.'}
  else if(ST.final.pct>=70&&cov>=.7){verdict='Nearly ready';detail='Final test '+ST.final.pct+'%, coverage '+Math.round(cov*100)+'%, '+unEx.length+' official answers still open. Retest the Mistakes tab, then repeat the final test.'}
  else{verdict='Not ready yet';detail='Final test '+ST.final.pct+'%, coverage '+Math.round(cov*100)+'%. Finish the exercises, clear the Mistakes tab, then retake the final test.'}
  let h='<div class="card"><p class="eyebrow">Readiness</p><h2>'+verdict+'</h2><p class="note" style="margin-top:6px">'+esc(detail)+'</p></div>';
  h+='<div class="card"><h3>1. Exercises completed</h3><p class="note">'+done.length+' of '+EXS.length+' exercises fully attempted · '+exAtt+' of '+ek.length+' items</p><div style="margin-top:8px">'+EXS.map(e=>{const a=e.keys.filter(k=>rec(k)).length,r=e.keys.filter(k=>rec(k)&&rec(k).last==='r').length;return '<div class="rowitem"><span class="small">'+esc(e.short)+' · '+esc(e.title.replace(/^.*· /,''))+'</span><span class="k">'+a+'/'+e.keys.length+' tried · '+r+' right now</span></div>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>2. Vocabulary</h3><p class="note">'+vs.strong.length+' mastered · '+vs.shaky.length+' shaky · '+vs.weak.length+' weak · '+vs.new.length+' not tested ('+vAtt+' of '+vk.length+' tried)</p>'+(vs.weak.length?'<p class="small" style="margin-top:8px"><b>Weak:</b> '+esc(vs.weak.join(', '))+'</p>':'')+(vs.shaky.length?'<p class="small" style="margin-top:6px"><b>Shaky:</b> '+esc(vs.shaky.join(', '))+'</p>':'')+(vs.new.length?'<p class="small" style="margin-top:6px"><b>Not tested:</b> '+esc(vs.new.join(', '))+'</p>':'')+'</div>';
  h+='<div class="card"><h3>3. Grammar rules</h3><div style="margin-top:6px">'+GRULES.map(g=>{const a=g.keys.filter(k=>rec(k)).length,r=g.keys.filter(k=>rec(k)&&rec(k).last==='r').length;const st=!a?'not started':(a===g.keys.length&&r/g.keys.length>=.67?'understood':'weak');return '<div class="rowitem"><span class="small">'+esc(g.title)+'</span><span class="chip '+(st==='understood'?'strong':st==='weak'?'weak':'')+'">'+st+' · '+r+'/'+g.keys.length+'</span></div>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>4. Official answers you still miss</h3>'+(unEx.length?'<div style="margin-top:6px">'+unEx.map(k=>{const it=ITEMS[k];return '<div class="rowitem"><span class="k">'+esc(it.tag)+'</span><span class="small" style="flex:1 1 240px"><b>'+esc(ansList(it).join('  /  '))+'</b></span></div>'}).join('')+'</div>':'<p class="note">None open.</p>')+'</div>';
  h+='<div class="card"><h3>5. Final test</h3><p class="note">'+(ST.final?ST.final.score+'/'+ST.final.total+' ('+ST.final.pct+'%)':'Not taken yet.')+'</p></div>';
  h+='<h3>Not in your source file</h3>'+GAPS.map(g=>'<div class="card dash small"><span class="chip">'+esc(g.l==='ALL'?'General':g.l)+'</span> '+esc(g.t)+'</div>').join('');
  h+='<div class="row"><button class="btn ghost sm" data-act="reset">'+(RESET?'Tap again to erase progress and the clock':'Reset everything')+'</button></div>';
  return h;
}

/* ---------- render & events ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===ST.tab)));
  const v=$('#view');
  if(ENG&&ENG.tab===ST.tab){v.innerHTML=engineHTML();const a=$('#ans');if(a)a.focus({preventScroll:true});return}
  v.innerHTML=({study:viewStudy,grammar:viewGrammar,mistakes:viewMistakes,report:viewReport})[ST.tab]();
}
function blockItems(b){return EXS.filter(e=>b.lessons.indexOf(e.lesson)>=0).reduce((a,e)=>a.concat(e.keys),[])}
function recallQueue(){
  const un=unresolved(),sent=shuffle(exKeys().filter(k=>ITEMS[k].kind==='sentence')).slice(0,6),oth=shuffle(exKeys().filter(k=>ITEMS[k].kind!=='sentence'&&ITEMS[k].kind!=='self')).slice(0,8);
  return Array.from(new Set(un.concat(sent,oth))).slice(0,30);
}
function finalQueue(){
  const ex=exKeys().filter(k=>ITEMS[k].kind!=='self'),sent=shuffle(ex.filter(k=>ITEMS[k].kind==='sentence')).slice(0,4),oth=shuffle(ex.filter(k=>ITEMS[k].kind!=='sentence')).slice(0,8),v=shuffle(vocKeys().filter(k=>k.indexOf('V:')===0)).slice(0,8);
  return shuffle(v.concat(sent,oth));
}
function act(a,el){
  const E=ENG;
  switch(a){
  case 'timerToggle':if(ST.timerRunAt)pauseTimer();else startTimer();break;
  case 'timerMode':pauseTimer();ST.timerMode=el.dataset.mode;if(ST.timerMode==='pomodoro'){ST.pomoPhase='work';ST.pomoRound=1;ST.pomoRemainingMs=25*60*1000}save();tick();break;
  case 'timerReset':ST.timerElapsedMs=0;ST.timerRunAt=null;ST.startedAt=null;ST.pomoPhase='work';ST.pomoRound=1;ST.pomoRemainingMs=25*60*1000;save();tick();break;
  case 'pomoSkip':if(ST.timerRunAt){ST.timerElapsedMs+=Date.now()-ST.timerRunAt;ST.timerRunAt=Date.now()}nextPomoPhase();save();tick();break;
  case 'goblock':ST.block=el.dataset.id;ST.tab='study';ENG=null;VL=null;save();render();tick();break;
  case 'learn':VL=Number(el.dataset.i);ENG=null;ST.tab='study';ST.block='vocab';render();window.scrollTo(0,0);break;
  case 'vback':VL=null;render();break;
  case 'vtest':{const g=VGROUPS[VL],i=VL;startEngine({title:g.name,keys:shuffle(g.keys),mode:'vocab',tab:'study',next:i+1<VGROUPS.length?{label:'Next group',act:'learn',i:i+1}:null});break}
  case 'vweak':{const k=vocKeys().filter(k=>{const s=status(k);return s==='weak'||s==='shaky'});if(k.length){ST.tab='study';startEngine({title:'Weak vocabulary',keys:shuffle(k),mode:'vocab',tab:'study'})}break}
  case 'startex':{const e=EXS.find(x=>x.id===el.dataset.id);startEngine({title:e.short+' · '+e.title.replace(/^.*· /,''),keys:e.keys,tab:'study'});break}
  case 'runblock':{const b=BLOCKS.find(x=>x.id===el.dataset.id),all=blockItems(b),todo=all.filter(k=>{const s=status(k);return s==='new'||s==='weak'});startEngine({title:b.name,keys:todo.length?todo:all,tab:'study'});break}
  case 'recallgo':startEngine({title:'Mixed recall',keys:recallQueue(),tab:'study',mode:'recall'});break;
  case 'recallsent':startEngine({title:'Sentence transformations',keys:shuffle(exKeys().filter(k=>ITEMS[k].kind==='sentence')),tab:'study',mode:'recall'});break;
  case 'finalgo':startEngine({title:'Final test',keys:finalQueue(),tab:'study',mode:'final'});break;
  case 'gr':GR=Number(el.dataset.i);render();break;
  case 'grpractice':startEngine({title:'Grammar · '+GRULES[GR].title,keys:GRULES[GR].keys,tab:'grammar',mode:'gram'});break;
  case 'toggleReview':{const k=el.dataset.key;ST.review=ST.review||[];ST.review=ST.review.includes(k)?ST.review.filter(x=>x!==k):ST.review.concat(k);save();render();break;}
  case 'unmark':ST.review=(ST.review||[]).filter(k=>k!==el.dataset.key);save();render();break;
  case 'reviewgo':{const q=(ST.review||[]).filter(k=>ITEMS[k]);if(q.length)startEngine({title:'Top revision · marked questions',keys:shuffle(q),tab:'mistakes',mode:'recall'});break;}
  case 'retestall':{const u=unresolved();if(u.length){ST.tab='mistakes';startEngine({title:'Retest mistakes',keys:shuffle(u),tab:'mistakes',mode:'recall'})}break}
  case 'retrymiss':{const m=Object.keys(E.first).filter(k=>!E.first[k].ok);const cfg={title:E.title+' · retry',keys:m,tab:E.tab,mode:E.mode==='final'?'recall':E.mode};startEngine(cfg);break}
  case 'exit':ENG=null;render();break;
  case 'check':submit(grabInput());break;
  case 'rcheck':recallSubmit(grabInput());break;
  case 'pick':if(E.stage==='recall')recallSubmit(el.dataset.v);else submit(el.dataset.v);break;
  case 'skip':submit('');break;
  case 'hint':{const it=ITEMS[E.queue[E.pos]],h=it.hint||it.answers[0];E.hint=true;$('#hintline').textContent=h.charAt(0)+h.slice(1).replace(/[A-Za-z0-9]/g,' _').replace(/ {2,}/g,' ');const a=$('#ans');if(a)a.focus();break}
  case 'reveal':E.stage='selfshow';render();break;
  case 'selfok':record(E.queue[E.pos],true);if(!E.first[E.queue[E.pos]])E.first[E.queue[E.pos]]={ok:true,val:''};advance();break;
  case 'selfmiss':{const k=E.queue[E.pos];record(k,false);if(!E.first[k])E.first[k]={ok:false,val:''};requeue(k);advance();break}
  case 'cover':E.stage='recall';E.rc=0;render();break;
  case 'next':advance();break;
  case 'reset':if(RESET){ST=fresh();save();ENG=null;VL=null;RESET=false;render();tick()}else{RESET=true;render()}break;
  }
}
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-tab]');
  if(t){ST.tab=t.dataset.tab;save();RESET=false;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!ENG||ENG.tab!==ST.tab||e.target.tagName==='BUTTON')return;
  const p=document.querySelector('#view [data-primary]');if(p){e.preventDefault();p.click()}
});
buildTimeline();
if(ST.timerRunAt&&curBlock()&&curBlock()!=='over')ST.block=curBlock().id;
render();tick();setInterval(tick,1000);
</script>

</body></html>
